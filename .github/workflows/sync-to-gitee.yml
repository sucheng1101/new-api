name: Sync Release to Gitee

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to sync
        required: true
        type: string

env:
  GITEE_OWNER: sucheng1101
  GITEE_REPO: new-api

jobs:
  sync-to-gitee:
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          set -euo pipefail
          release_info=$(gh release view "$TAG_NAME" --json name,body,tagName,targetCommitish)
          {
            echo "tag_name=$TAG_NAME"
            echo "release_name=$(echo "$release_info" | jq -r '.name')"
            echo "target_commitish=$(echo "$release_info" | jq -r '.targetCommitish')"
            echo "release_body<<EOF"
            echo "$release_info" | jq -r '.body'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm -rf release_assets
          mkdir -p release_assets
          gh release download "$TAG_NAME" --dir release_assets

      - name: Create Gitee release
        id: create_release
        uses: nICEnnnnnnnLee/action-gitee-release@v2.0.0
        with:
          gitee_action: create_release
          gitee_owner: ${{ env.GITEE_OWNER }}
          gitee_repo: ${{ env.GITEE_REPO }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ steps.release_info.outputs.tag_name }}
          gitee_release_name: ${{ steps.release_info.outputs.release_name }}
          gitee_release_body: ${{ steps.release_info.outputs.release_body }}
          gitee_target_commitish: ${{ steps.release_info.outputs.target_commitish }}

      - name: Upload assets to Gitee
        if: hashFiles('release_assets/*') != ''
        uses: nICEnnnnnnnLee/action-gitee-release@v2.0.0
        with:
          gitee_action: upload_asset
          gitee_owner: ${{ env.GITEE_OWNER }}
          gitee_repo: ${{ env.GITEE_REPO }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_release_id: ${{ steps.create_release.outputs.release-id }}
          gitee_upload_retry_times: 3
          gitee_files: |
            release_assets/*

      - name: Cleanup
        if: always()
        run: rm -rf release_assets
